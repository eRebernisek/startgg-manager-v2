apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def nonempty = { value ->
    (value != null && value.toString().length() > 0) ? value.toString() : null
}

// Environment variables override keystore.properties so CI can pass secrets without a file.
def releaseStorePath = nonempty(System.getenv("ANDROID_KEYSTORE_PATH")) ?: nonempty(keystoreProperties.getProperty("storeFile"))
def releaseStorePassword = nonempty(System.getenv("ANDROID_KEYSTORE_PASSWORD")) ?: nonempty(keystoreProperties.getProperty("storePassword"))
def releaseKeyAlias = nonempty(System.getenv("ANDROID_KEY_ALIAS")) ?: nonempty(keystoreProperties.getProperty("keyAlias"))
def releaseKeyPassword = nonempty(System.getenv("ANDROID_KEY_PASSWORD")) ?: nonempty(keystoreProperties.getProperty("keyPassword"))

// storeFile in keystore.properties is relative to android/. ANDROID_KEYSTORE_PATH may be absolute.
def releaseStoreFile = null
if (releaseStorePath != null) {
    def candidate = new File(releaseStorePath)
    releaseStoreFile = candidate.isAbsolute() ? candidate : rootProject.file(releaseStorePath)
}

def hasReleaseSigning = releaseStoreFile != null && releaseStorePassword != null && releaseKeyAlias != null && releaseKeyPassword != null

android {
    namespace = "gg.startmanager.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "gg.startmanager.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.name == "bundleRelease" || it.name == "assembleRelease" }
    if (!wantsRelease) {
        return
    }
    if (!hasReleaseSigning) {
        throw new GradleException("Release signing is not configured. Copy android/keystore.properties.example to android/keystore.properties, or set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD. See ANDROID_RELEASE.md.")
    }
    if (!releaseStoreFile.exists()) {
        throw new GradleException("Upload keystore not found at ${releaseStoreFile}. Generate it with keytool; see ANDROID_RELEASE.md.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
